<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Anorak Arcade player profile — Arcade Score, division, and per-game world ranks.">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Profile — Anorak Arcade</title>
<link rel="stylesheet" href="site.css">
<style>
  .pcard{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;flex-wrap:wrap}
  .pava{width:84px;height:84px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:46px;border-radius:20px;background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--acc) 22%,transparent),#0c1220);border:1px solid var(--line2)}
  .pid{flex:1;min-width:160px}
  .pid h1{margin:0;font-size:26px;letter-spacing:.04em}
  .pid .sub{color:var(--dim);font-size:12px;letter-spacing:.1em;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .divb{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#0a0e14}
  .editava{background:none;border:1px solid var(--line2);color:var(--dim);font-family:inherit;font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;letter-spacing:.1em}
  .editava:hover{color:var(--ink);border-color:var(--ink)}
  .pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0 6px}
  .pcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}
  .pcell .k{color:var(--dim);font-size:10px;letter-spacing:.18em}
  .pcell .v{font-size:26px;font-weight:800;margin-top:3px;color:var(--acc);font-variant-numeric:tabular-nums}
  table.lb{border-collapse:collapse;width:100%;font-size:13px}
  table.lb th{color:var(--dim);text-align:left;font-size:10px;letter-spacing:.18em;padding:6px 10px;border-bottom:1px solid var(--line)}
  table.lb td{padding:9px 10px;border-bottom:1px solid #161d2b}
  table.lb .rank{color:var(--dim);width:54px}
  table.lb .nm{font-weight:700;letter-spacing:.04em}
  table.lb .sc{text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);padding:16px 0}
  .back{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:.1em}
  .back:hover{color:var(--ink)}
  /* avatar picker modal */
  #avawrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.82)}
  #avawrap.open{display:flex}
  .avabox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;width:330px;max-width:88vw;text-align:center}
  .avabox h3{margin:0 0 4px;font-size:13px;letter-spacing:.2em;color:var(--acc)}
  .avabox .hint{color:var(--dim);font-size:12px;margin-bottom:14px}
  .avagrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .avagrid button{font-size:26px;line-height:1;padding:8px 0;background:#0a0e14;border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .avagrid button:hover{border-color:var(--acc)}
  .avagrid button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
</style>
</head>
<body class="v2">
<div class="fx" aria-hidden="true"><span class="orb a" data-depth="0.020"></span><span class="orb b" data-depth="0.035"></span><span class="orb c" data-depth="0.050"></span></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<nav class="nav">
  <a class="brand" href="index.html"><span class="dot"></span>ANORAK ARCADE</a>
  <span class="spacer"></span>
  <a class="link" href="index.html">ARCADE</a>
  <a class="link" href="leaderboard.html">LEADERBOARD</a>
  <a class="link" href="about.html">ABOUT</a>
</nav>

<div class="wrap">
  <a class="back" href="leaderboard.html">← back to leaderboard</a>
  <div id="profile"><div class="empty" style="margin-top:20px">Loading…</div></div>
</div>

<div id="avawrap"><div class="avabox">
  <h3>CHOOSE YOUR ICON</h3>
  <div class="hint">Pick a profile picture — shows on every leaderboard.</div>
  <div class="avagrid" id="avagrid"></div>
</div></div>

<div class="footer">Anorak Arcade · <a href="index.html">arcade</a> · <a href="leaderboard.html">leaderboard</a></div>

<script src="site.js"></script>
<script src="stats.js"></script>
<script src="chrome.js"></script>
<script>
(()=>{
  const AVATARS=['👾','🕹️','🎮','🛸','👑','🔥','⚡','💎','🌟','🎯','🦾','🐉','🤖','🦅','🧪','🎲','🧙','💀','🪄','🌌','🛡️','🚀','🍄','🎺'];
  const DIVCOL={Bronze:'#c87a3f',Silver:'#c6ced8',Gold:'#ffd23f',Platinum:'#9fe7e0',Diamond:'#7fd3ff'};
  const COLORS={CINDER:'#ff6a3d',SHIFT:'#5ad1ff',CONDUIT:'#b98cff',HOMEOSTAT:'#36d399',NOVA:'#ff5ec7',SURGE:'#ffd23f',CLEAVE:'#3fe0c2',FLUX:'#6c8cff',WEAVE:'#d6f84a',PULSE:'#ff2e4d',MOTHERLOAD:'#e8a13a',MOTHERLOAD_CASH:'#79e08a',ECOTONE:'#7fc24a'};
  const LABELS={MOTHERLOAD:'MOTHERLOAD · DEPTH',MOTHERLOAD_CASH:'MOTHERLOAD · CASH'};
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const qp=new URLSearchParams(location.search);
  const name=qp.get('name')||'';
  const root=document.getElementById('profile');

  function fmtScore(g,s){ s=Number(s)||0; if(g==='MOTHERLOAD_CASH')return '$'+s.toLocaleString(); if(g==='MOTHERLOAD')return s.toLocaleString()+'m'; return s.toLocaleString(); }
  function medal(r){ return r===1?'🥇':r===2?'🥈':r===3?'🥉':'#'+r; }

  if(!name){ root.innerHTML='<div class="empty" style="margin-top:20px">No player specified.</div>'; return; }
  if(!GameStats.hasAPI){ root.innerHTML='<div class="empty" style="margin-top:20px">Profiles need the live API.</div>'; return; }

  function render(d){
    const isMe=(GameStats.getName()||'').toLowerCase()===name.toLowerCase();
    const div=d.division||'';
    const games=d.games||[];
    root.innerHTML=
      '<div class="pcard">'+
        '<div class="pava" id="bigava">'+(d.avatar||'👾')+'</div>'+
        '<div class="pid"><h1>'+esc(d.name)+'</h1>'+
          '<div class="sub">'+
            (div?'<span class="divb" style="background:'+(DIVCOL[div]||'#888')+'">'+div+'</span>':'')+
            (d.worldNo1>0?'<span>👑 World #1 ×'+d.worldNo1+'</span>':'')+
            (isMe?'<button class="editava" id="editava">CHANGE PICTURE</button>':'')+
          '</div></div>'+
      '</div>'+
      '<div class="pstats">'+
        '<div class="pcell"><div class="k">ARCADE SCORE</div><div class="v">'+Number(d.arcadeScore||0).toLocaleString()+'</div></div>'+
        '<div class="pcell"><div class="k">GAMES RANKED</div><div class="v">'+games.length+'</div></div>'+
        '<div class="pcell"><div class="k">WORLD #1s</div><div class="v">'+(d.worldNo1||0)+'</div></div>'+
      '</div>'+
      '<h2 class="section-h v2">▶ RANKS</h2>'+
      (games.length?'<table class="lb"><tr><th class="rank">RANK</th><th>GAME</th><th class="sc">BEST</th></tr>'+
        games.map(g=>{ const c=COLORS[g.game]||'#888';
          return '<tr><td class="rank">'+medal(g.rank)+'</td><td class="nm" style="color:'+c+'">'+esc(LABELS[g.game]||g.game)+'</td><td class="sc">'+fmtScore(g.game,g.best)+'</td></tr>';
        }).join('')+'</table>'
        :'<div class="empty">No ranked games yet.</div>');
    if(isMe){ const b=document.getElementById('editava'); if(b) b.onclick=openPicker; }
    window.AAChrome&&AAChrome.bind(root);
  }

  function openPicker(){
    const wrap=document.getElementById('avawrap'), grid=document.getElementById('avagrid');
    const cur=GameStats.getAvatar();
    grid.innerHTML=AVATARS.map(a=>'<button data-a="'+a+'" class="'+(a===cur?'on':'')+'">'+a+'</button>').join('');
    grid.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
      const a=btn.getAttribute('data-a');
      GameStats.setAvatar(a).then(()=>{ const big=document.getElementById('bigava'); if(big) big.textContent=a; wrap.classList.remove('open'); });
    });
    wrap.classList.add('open');
    wrap.onclick=e=>{ if(e.target===wrap) wrap.classList.remove('open'); };
  }

  GameStats.api('/api/profile?name='+encodeURIComponent(name))
    .then(d=>{ if(!d||d.error){ root.innerHTML='<div class="empty" style="margin-top:20px">Player not found.</div>'; return; } render(d); })
    .catch(()=>{ root.innerHTML='<div class="empty" style="margin-top:20px">Couldn’t load this profile.</div>'; });
})();
</script>
</body>
</html>

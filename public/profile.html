<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Anorak Arcade player profile — Arcade Score, rank, division, and per-game world ranks.">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Profile — Anorak Arcade</title>
<link rel="stylesheet" href="site.css">
<style>
  html,body{overflow-x:hidden;max-width:100%}
  .pcard{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;flex-wrap:wrap}
  .pava{width:80px;height:80px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:44px;border-radius:20px;background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--acc) 22%,transparent),#0c1220);border:1px solid var(--line2);position:relative}
  .pava.editable{cursor:pointer}
  .pava .edit{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#0a0e14;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}
  .pid{flex:1;min-width:150px}
  .pid h1{margin:0;font-size:24px;letter-spacing:.04em;word-break:break-word}
  .pid .sub{color:var(--dim);font-size:12px;letter-spacing:.08em;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .divb{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#0a0e14}
  .pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .pbtn{background:none;border:1px solid var(--line2);color:var(--dim);font-family:inherit;font-size:11px;padding:7px 13px;border-radius:8px;cursor:pointer;letter-spacing:.1em}
  .pbtn:hover{color:var(--ink);border-color:var(--ink)}
  .pbtn.primary{background:var(--acc);border-color:transparent;color:#0a0e14;font-weight:700}
  .pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
  @media(min-width:560px){.pstats{grid-template-columns:repeat(4,1fr)}}
  .pcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center}
  .pcell .k{color:var(--dim);font-size:9px;letter-spacing:.16em}
  .pcell .v{font-size:23px;font-weight:800;margin-top:3px;color:var(--acc);font-variant-numeric:tabular-nums}
  table.lb{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
  table.lb th{color:var(--dim);text-align:left;font-size:10px;letter-spacing:.16em;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.lb td{padding:10px 8px;border-bottom:1px solid #161d2b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.lb .rank{color:var(--dim);width:50px}
  table.lb .nm{font-weight:700;letter-spacing:.04em}
  table.lb .sc{text-align:right;font-variant-numeric:tabular-nums;width:96px}
  tr.grow{cursor:pointer}
  tr.grow:hover td{background:rgba(255,177,61,.06)}
  tr.grow .nm::after{content:' ▸';color:var(--dim)}
  .empty{color:var(--dim);padding:16px 0}
  .back{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:.1em}
  .back:hover{color:var(--ink)}
  .setsec{margin-top:22px}
  .setrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #161d2b}
  .setrow .lbl{flex:1;font-size:13px;letter-spacing:.03em}
  .seg{display:flex;gap:6px}
  .seg button{min-height:36px;background:var(--bg2,#070a10);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.08em;border-radius:9px;padding:0 12px;cursor:pointer}
  .seg button.on{color:#0a0e14;background:var(--acc);border-color:transparent;font-weight:700}
  #avawrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.82);padding:20px}
  #avawrap.open{display:flex}
  .avabox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;width:330px;max-width:88vw;text-align:center}
  .avabox h3{margin:0 0 4px;font-size:13px;letter-spacing:.2em;color:var(--acc)}
  .avabox .ahint{color:var(--dim);font-size:12px;margin-bottom:14px}
  .avagrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .avagrid button{font-size:24px;line-height:1;padding:8px 0;background:#0a0e14;border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .avagrid button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-size:12px;padding:9px 16px;border-radius:10px;z-index:10000;opacity:0;transition:opacity .2s;letter-spacing:.04em}
  .toast.show{opacity:1}
</style>
</head>
<body class="v2">
<div class="fx" aria-hidden="true"><span class="orb a" data-depth="0.020"></span><span class="orb b" data-depth="0.035"></span><span class="orb c" data-depth="0.050"></span></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<nav class="nav">
  <a class="brand" href="index.html"><span class="dot"></span>ANORAK ARCADE</a>
  <span class="spacer"></span>
  <a class="link" href="index.html">ARCADE</a>
  <a class="link" href="leaderboard.html">LEADERBOARD</a>
  <a class="link" href="about.html">ABOUT</a>
</nav>

<div class="wrap">
  <a class="back" href="leaderboard.html">← leaderboard</a>
  <div id="profile"><div class="empty" style="margin-top:20px">Loading…</div></div>
</div>

<div id="avawrap"><div class="avabox">
  <h3>CHOOSE YOUR ICON</h3>
  <div class="ahint">Pick a profile picture — shows on every leaderboard.</div>
  <div class="avagrid" id="avagrid"></div>
</div></div>
<div class="toast" id="toast"></div>

<div class="footer">Anorak Arcade · <a href="index.html">arcade</a> · <a href="leaderboard.html">leaderboard</a></div>

<script src="site.js"></script>
<script src="stats.js"></script>
<script src="chrome.js"></script>
<script>
(()=>{
  const AVATARS=['👾','🕹️','🎮','🛸','👑','🔥','⚡','💎','🌟','🎯','🦾','🐉','🤖','🦅','🧪','🎲','🧙','💀','🪄','🌌','🛡️','🚀','🍄','🎺'];
  const DIVCOL={Bronze:'#c87a3f',Silver:'#c6ced8',Gold:'#ffd23f',Platinum:'#9fe7e0',Diamond:'#7fd3ff'};
  const COLORS={CINDER:'#ff6a3d',SHIFT:'#5ad1ff',CONDUIT:'#b98cff',HOMEOSTAT:'#36d399',NOVA:'#ff5ec7',SURGE:'#ffd23f',CLEAVE:'#3fe0c2',FLUX:'#6c8cff',WEAVE:'#d6f84a',PULSE:'#ff2e4d',MOTHERLOAD:'#e8a13a',MOTHERLOAD_CASH:'#79e08a',ECOTONE:'#7fc24a'};
  const LABELS={MOTHERLOAD:'MOTHERLOAD · DEPTH',MOTHERLOAD_CASH:'MOTHERLOAD · CASH'};
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const NATIVE=document.documentElement.classList.contains('aa-native');
  const root=document.getElementById('profile');
  const name=(new URLSearchParams(location.search)).get('name')||'';
  const selfName=GameStats.getName()||'';
  const isSelf=!name || (selfName && name.toLowerCase()===selfName.toLowerCase());
  const target=name||selfName;

  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }
  function entry(g){ if(g==='MOTHERLOAD'||g==='MOTHERLOAD_CASH')return 'motherload/index.html'; if(g==='ECOTONE')return 'ecotone/index.html'; return g.toLowerCase()+'.html'; }
  function fmtScore(g,s){ s=Number(s)||0; if(g==='MOTHERLOAD_CASH')return '$'+s.toLocaleString(); if(g==='MOTHERLOAD')return s.toLocaleString()+'m'; return s.toLocaleString(); }
  function medal(r){ return r===1?'🥇':r===2?'🥈':r===3?'🥉':'#'+r; }

  if(!GameStats.hasAPI){ root.innerHTML='<div class="empty" style="margin-top:20px">Profiles need the live API.</div>'; return; }
  if(!target){
    // self, but no name yet → onboard
    root.innerHTML='<div class="pcard"><div class="pava">👾</div><div class="pid"><h1>Set up your profile</h1>'+
      '<div class="sub">Pick a handle to appear on the leaderboards.</div>'+
      '<div class="pbtns"><button class="pbtn primary" id="su">SET NAME</button></div></div></div>';
    document.getElementById('su').onclick=()=>GameStats.promptName(()=>location.reload());
    return;
  }

  function settingsHTML(){
    const hOn=localStorage.getItem('aa.haptics')!=='0';
    const juice=localStorage.getItem('aa.juice')||'full';
    const signedIn=!!localStorage.getItem('aa.token');
    let h='<div class="setsec"><h2 class="section-h v2">⚙ SETTINGS</h2>';
    if(NATIVE) h+='<div class="setrow"><span class="lbl">Haptics</span><div class="seg" data-set="haptics">'+
      '<button data-v="1" class="'+(hOn?'on':'')+'">ON</button><button data-v="0" class="'+(!hOn?'on':'')+'">OFF</button></div></div>'+
      '<div class="setrow"><span class="lbl">Feel / juice</span><div class="seg" data-set="juice">'+
      '<button data-v="full" class="'+(juice==='full'?'on':'')+'">FULL</button><button data-v="subtle" class="'+(juice==='subtle'?'on':'')+'">SUBTLE</button><button data-v="off" class="'+(juice==='off'?'on':'')+'">OFF</button></div></div>';
    h+='<div class="setrow"><span class="lbl">Account</span><span style="color:var(--dim);font-size:12px">'+(signedIn?'Signed in with Apple':'Guest')+'</span></div>';
    if(!signedIn && NATIVE && window.AnorakNative && AnorakNative.signInWithApple)
      h+='<div class="pbtns" style="margin-top:12px"><button class="pbtn primary" id="siwa"> Sign in with Apple</button></div>';
    return h+'</div>';
  }
  function wireSettings(){
    document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const key=seg.getAttribute('data-set'), v=b.getAttribute('data-v');
      if(key==='haptics') localStorage.setItem('aa.haptics', v==='1'?'1':'0');
      if(key==='juice'){ localStorage.setItem('aa.juice', v); document.documentElement.setAttribute('data-juice', v); }
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    }));
    const si=document.getElementById('siwa'); if(si&&window.AnorakNative&&AnorakNative.signInWithApple) si.onclick=()=>{ Promise.resolve(AnorakNative.signInWithApple()).then(ok=>{ if(ok) location.reload(); }); };
  }

  function render(d){
    const div=d.division||'', games=d.games||[];
    const signedIn=!!localStorage.getItem('aa.token');
    root.innerHTML=
      '<div class="pcard">'+
        '<div class="pava'+(isSelf?' editable':'')+'" id="bigava">'+(d.avatar||'👾')+(isSelf?'<span class="edit">✎</span>':'')+'</div>'+
        '<div class="pid"><h1>'+esc(d.name)+'</h1>'+
          '<div class="sub">'+(div?'<span class="divb" style="background:'+(DIVCOL[div]||'#888')+'">'+div+'</span>':'')+
            (d.worldNo1>0?'<span>👑 ×'+d.worldNo1+'</span>':'')+'</div>'+
          '<div class="pbtns">'+
            (isSelf?'<button class="pbtn" id="chName">CHANGE NAME</button><button class="pbtn" id="chPic">CHANGE PICTURE</button>'
                   :(signedIn?'<button class="pbtn primary" id="addFr">+ ADD FRIEND</button>':''))+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="pstats">'+
        '<div class="pcell"><div class="k">ARCADE SCORE</div><div class="v">'+Number(d.arcadeScore||0).toLocaleString()+'</div></div>'+
        '<div class="pcell"><div class="k">ARCADE RANK</div><div class="v">'+(d.arcadeRank?'#'+d.arcadeRank:'—')+'</div></div>'+
        '<div class="pcell"><div class="k">WORLD #1s</div><div class="v">'+(d.worldNo1||0)+'</div></div>'+
        '<div class="pcell"><div class="k">GAMES RANKED</div><div class="v">'+games.length+'</div></div>'+
      '</div>'+
      '<h2 class="section-h v2">▶ RANKS</h2>'+
      (games.length?'<table class="lb"><tr><th class="rank">RANK</th><th>GAME</th><th class="sc">BEST</th></tr>'+
        games.map(g=>{ const c=COLORS[g.game]||'#888';
          return '<tr class="grow" data-play="'+entry(g.game)+'"><td class="rank">'+medal(g.rank)+'</td><td class="nm" style="color:'+c+'">'+esc(LABELS[g.game]||g.game)+'</td><td class="sc">'+fmtScore(g.game,g.best)+'</td></tr>';
        }).join('')+'</table>'
        :'<div class="empty">No ranked games yet.</div>')+
      (isSelf?settingsHTML():'');

    // wire
    if(isSelf){
      const bp=document.getElementById('bigava'); if(bp) bp.onclick=openPicker;
      const cn=document.getElementById('chName'); if(cn) cn.onclick=()=>GameStats.promptName(()=>location.reload());
      const cp=document.getElementById('chPic'); if(cp) cp.onclick=openPicker;
      wireSettings();
    } else {
      const af=document.getElementById('addFr'); if(af) af.onclick=addFriend;
    }
    document.querySelectorAll('tr.grow[data-play]').forEach(tr=>tr.onclick=()=>{ location.href=tr.getAttribute('data-play'); });
    window.AAChrome&&AAChrome.bind(root);
  }

  function openPicker(){
    const wrap=document.getElementById('avawrap'), grid=document.getElementById('avagrid'), cur=GameStats.getAvatar();
    grid.innerHTML=AVATARS.map(a=>'<button data-a="'+a+'" class="'+(a===cur?'on':'')+'">'+a+'</button>').join('');
    grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const a=b.getAttribute('data-a');
      GameStats.setAvatar(a).then(res=>{
        wrap.classList.remove('open');
        if(res && res.ok===false){ toast(res.reason||'Couldn’t save picture'); return; }
        const big=document.getElementById('bigava');
        if(big){ big.innerHTML=a+'<span class="edit">✎</span>'; big.onclick=openPicker; }
        toast('Picture updated');
      });
    });
    wrap.classList.add('open'); wrap.onclick=e=>{ if(e.target===wrap) wrap.classList.remove('open'); };
  }

  function addFriend(){
    const tok=localStorage.getItem('aa.token'); if(!tok){ toast('Sign in to add friends'); return; }
    fetch('https://anorak-arcade-api.sean-ellul.workers.dev/api/friends/add',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({handle:target})})
      .then(r=>r.json()).then(d=>{ toast(d&&d.ok?('Added '+target+' as a friend'):(d&&d.error||'Couldn’t add friend')); const b=document.getElementById('addFr'); if(b&&d&&d.ok){ b.textContent='✓ FRIEND'; b.disabled=true; } })
      .catch(()=>toast('Couldn’t reach the server'));
  }

  GameStats.api('/api/profile?name='+encodeURIComponent(target))
    .then(d=>{ if(!d||d.error){ root.innerHTML='<div class="empty" style="margin-top:20px">Player not found.</div>'; return; } render(d); })
    .catch(()=>{ root.innerHTML='<div class="empty" style="margin-top:20px">Couldn’t load this profile.</div>'; });
})();
</script>
</body>
</html>

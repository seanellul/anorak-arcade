<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Anorak Arcade — follow players, see who's ahead, and track the competition.">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Social — Anorak Arcade</title>
<link rel="stylesheet" href="site.css">
<style>
  html,body{overflow-x:hidden;max-width:100%}
  .shead{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
  .shead h1{font-size:28px;letter-spacing:.02em;margin:0;flex:1}
  .ssub{color:var(--dim);font-size:12.5px;line-height:1.5;margin:2px 2px 12px}
  /* segmented tabs — equal columns inside one pill, no horizontal scroll */
  .subtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:8px 0 16px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .subtabs button{background:transparent;border:0;color:var(--dim);font-family:inherit;font-size:9px;letter-spacing:.02em;padding:11px 1px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent}
  .subtabs button.on{color:#0a0e14;background:var(--acc);font-weight:700}
  /* people rows as soft cards */
  .slist{display:flex;flex-direction:column;gap:8px}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;cursor:pointer}
  .srow:active{border-color:var(--line2)}
  .srow .av{font-size:22px;flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#0a0e14;border:1px solid var(--line)}
  .srow .mid{flex:1;min-width:0}
  .srow .nm{font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .meta{color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .divb{display:inline-block;padding:1px 7px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:.1em;color:#0a0e14}
  .vs{font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:99px;flex:0 0 auto}
  .vs.ahead{color:#36d399;background:color-mix(in srgb,#36d399 12%,transparent);border:1px solid color-mix(in srgb,#36d399 40%,transparent)}
  .vs.behind{color:#ff6a6a;background:color-mix(in srgb,#ff6a6a 12%,transparent);border:1px solid color-mix(in srgb,#ff6a6a 40%,transparent)}
  .vs.even{color:var(--dim);border:1px solid var(--line2)}
  .followbtn{flex:0 0 auto;background:var(--acc);border:0;color:#0a0e14;font-family:inherit;font-weight:700;font-size:10.5px;letter-spacing:.06em;padding:9px 14px;border-radius:10px;cursor:pointer;min-height:36px}
  .followbtn.out{background:transparent;border:1px solid var(--line2);color:var(--dim)}
  /* activity feed as soft cards */
  .feed{display:flex;flex-direction:column;gap:8px}
  .feed .fi{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;font-size:13px;line-height:1.45}
  .feed .fi .ic{flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#0a0e14;font-size:14px}
  .feed .fi .tx{flex:1;color:#c2ccdd}
  .feed .fi .tx b{color:var(--ink);font-weight:700}
  .findbar{display:flex;gap:8px;margin-bottom:10px}
  .findbar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;padding:13px 16px;border-radius:12px;outline:none}
  .findbar input:focus{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
  .empty{color:var(--dim);padding:18px 2px;text-align:center;font-size:13px}
  .signin{text-align:center;padding:30px 10px}
  .back{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:.1em}
  .bell{position:relative;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:18px;width:42px;height:42px;border-radius:12px;cursor:pointer;flex:0 0 auto}
  .bell .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ff2e4d;color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:18px}
  .bell .badge.show{display:flex}
  #ntray{position:fixed;inset:0;z-index:9999;display:none;background:rgba(4,6,11,.6);backdrop-filter:blur(3px)}
  #ntray.open{display:block}
  #ntray .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line2);padding:8px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -24px 70px rgba(0,0,0,.55)}
  #ntray .grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:8px auto 12px}
  #ntray .nhd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  #ntray .nhd h3{flex:1;margin:0;font-size:14px;letter-spacing:.18em}
  #ntray .filt{background:none;border:1px solid var(--line2);color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.08em;padding:6px 11px;border-radius:8px;cursor:pointer}
  .nitem{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;border-bottom:1px solid #161d2b;font-size:13px;line-height:1.45}
  .nitem.unread{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:8px}
  .nitem .ic{flex:0 0 auto;width:22px;text-align:center;font-size:16px}
  .nitem .tx{flex:1;color:#c2ccdd}
  .nitem .tx b{color:var(--ink);font-weight:700}
  .nitem .ago{color:var(--dim);font-size:11px;margin-top:2px}
  .prefs{padding:6px 0}
  .prefrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #161d2b}
  .prefrow .lbl{flex:1;font-size:13px}
  .toggle{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:0 0 auto}
  .toggle.on{background:var(--acc)}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
  .toggle.on::after{transform:translateX(18px)}
</style>
</head>
<body class="v2">
<div class="fx" aria-hidden="true"><span class="orb a" data-depth="0.020"></span><span class="orb b" data-depth="0.035"></span><span class="orb c" data-depth="0.050"></span></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<nav class="nav">
  <a class="brand" href="index.html"><span class="dot"></span>ANORAK ARCADE</a>
  <span class="spacer"></span>
  <a class="link" href="index.html">ARCADE</a>
  <a class="link" href="leaderboard.html">LEADERBOARD</a>
  <a class="link active" href="social.html">SOCIAL</a>
</nav>
<div class="wrap">
  <div class="shead"><h1>Social</h1><span id="counts" style="color:var(--dim);font-size:12px;letter-spacing:.06em"></span><button class="bell" id="bell" style="display:none">🔔<span class="badge" id="nbadge"></span></button></div>
  <p class="ssub">Follow players, see who’s ahead, and track the competition.</p>
  <div class="subtabs" id="subtabs">
    <button data-t="activity" class="on">ACTIVITY</button>
    <button data-t="following">FOLLOWING</button>
    <button data-t="followers">FOLLOWERS</button>
    <button data-t="duels">DUELS</button>
    <button data-t="find">FIND</button>
  </div>
  <div id="content"><div class="empty">Loading…</div></div>
</div>
<div id="ntray"><div class="panel">
  <div class="grab"></div>
  <div class="nhd"><h3>NOTIFICATIONS</h3><button class="filt" id="filt">FILTERS</button></div>
  <div id="nbody"><div class="empty">Loading…</div></div>
</div></div>
<div class="footer">Anorak Arcade · <a href="index.html">arcade</a> · <a href="leaderboard.html">leaderboard</a></div>
<script src="site.js"></script>
<script src="stats.js"></script>
<script src="chrome.js"></script>
<script>
(()=>{
  const API='https://anorak-arcade-api.sean-ellul.workers.dev';
  const COLORS={CINDER:'#ff6a3d',SHIFT:'#5ad1ff',CONDUIT:'#b98cff',HOMEOSTAT:'#36d399',NOVA:'#ff5ec7',SURGE:'#ffd23f',CLEAVE:'#3fe0c2',FLUX:'#6c8cff',WEAVE:'#d6f84a',PULSE:'#ff2e4d',MOTHERLOAD:'#e8a13a',MOTHERLOAD_CASH:'#79e08a',ECOTONE:'#7fc24a',INTERCEPT:'#ff8c42'};
  const DIVCOL={Bronze:'#c87a3f',Silver:'#c6ced8',Gold:'#ffd23f',Platinum:'#9fe7e0',Diamond:'#7fd3ff'};
  const DIVSHORT={Bronze:'BRZ',Silver:'SLV',Gold:'GLD',Platinum:'PLT',Diamond:'DIA'};
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const tok=()=>localStorage.getItem('aa.token')||'';
  function api(method,p,body){ const h={'Content-Type':'application/json'}; if(tok())h.Authorization='Bearer '+tok();
    return fetch(API+p,{method,headers:h,body:body?JSON.stringify(body):undefined}).then(r=>r.json().catch(()=>({}))).catch(()=>null); }
  const content=document.getElementById('content');
  let tab='activity';

  function prof(name){ return 'profile.html?name='+encodeURIComponent(name); }
  function feedLine(e){
    let pay={}; try{pay=JSON.parse(e.payload||'{}');}catch(x){}
    const g=esc(e.game||''), who=esc(e.actor||'someone'), sc=pay.score?Number(pay.score).toLocaleString():'';
    if(e.own&&e.kind==='overtaken')return '<span class="ic">⚔</span><span class="tx"><b>'+who+'</b> passed you in <b>'+g+'</b> — defend your spot</span>';
    if(e.own&&e.kind==='no1')return '<span class="ic">👑</span><span class="tx">You took <b>#1</b> in <b>'+g+'</b></span>';
    if(!e.own&&e.kind==='no1')return '<span class="ic">👑</span><span class="tx"><b>'+who+'</b> is <b>#1</b> in <b>'+g+'</b></span>';
    if(!e.own&&e.kind==='best')return '<span class="ic">▲</span><span class="tx"><b>'+who+'</b> set a new <b>'+g+'</b> best'+(sc?' · '+sc:'')+'</span>';
    return '';
  }
  function srow(p, right){
    const div=p.division?'<span class="divb" style="background:'+(DIVCOL[p.division]||'#888')+'">'+(DIVSHORT[p.division]||p.division)+'</span> ':'';
    const meta=(p.arcade!=null)?(div+Number(p.arcade||0).toLocaleString()+' arcade'):(p.ms?GameStats.fmt(p.ms):'');
    return '<div class="srow" data-prof="'+esc(p.name)+'"><span class="av">'+(p.avatar||'👾')+'</span>'+
      '<span class="mid"><div class="nm">'+esc(p.name)+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</span>'+(right||'')+'</div>';
  }
  function wireRows(){ content.querySelectorAll('.srow[data-prof]').forEach(r=>r.onclick=e=>{ if(e.target.closest('button'))return; location.href=prof(r.getAttribute('data-prof')); }); }

  function needSignIn(){
    content.innerHTML='<div class="signin"><div class="empty">Sign in to follow players, see your followers, and track the competition.</div>'+
      (window.AnorakNative&&AnorakNative.signInWithApple?'<button class="followbtn" id="si"> Sign in with Apple</button>':'')+'</div>';
    const si=document.getElementById('si'); if(si) si.onclick=()=>Promise.resolve(AnorakNative.signInWithApple()).then(ok=>{ if(ok) render(); });
  }

  function render(){
    document.querySelectorAll('#subtabs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-t')===tab));
    if(tab!=='find' && !tok()){ needSignIn(); return; }
    content.innerHTML='<div class="empty">Loading…</div>';
    if(tab==='activity'){
      api('GET','/api/feed').then(d=>{
        const evs=((d&&d.events)||[]).filter(e=>!(e.own&&e.kind==='best'));
        const lines=evs.map(feedLine).filter(Boolean);
        content.className=''; content.innerHTML=lines.length?('<div class="feed">'+lines.map(l=>'<div class="fi">'+l+'</div>').join('')+'</div>'):'<div class="empty">No activity yet — follow some players or play a game.</div>';
      });
    } else if(tab==='following'){
      api('GET','/api/friends').then(d=>{
        const fr=(d&&d.friends)||[]; document.getElementById('counts').textContent=fr.length+' following';
        if(!fr.length){ content.innerHTML='<div class="empty">You’re not following anyone yet. Try FIND.</div>'; return; }
        content.innerHTML='<div class="slist">'+fr.map(f=>{
          const vs=f.vs?'<span class="vs '+f.vs+'">'+(f.vs==='ahead'?'▲':f.vs==='behind'?'▼':'=')+' '+f.vs+'</span>':'';
          return srow(f, vs+'<button class="followbtn out" data-unf="'+esc(f.name)+'">FOLLOWING</button>');
        }).join('')+'</div>';
        content.querySelectorAll('[data-unf]').forEach(b=>b.onclick=()=>{ api('POST','/api/friends/remove',{handle:b.getAttribute('data-unf')}).then(()=>render()); });
        wireRows();
      });
    } else if(tab==='followers'){
      api('GET','/api/followers').then(d=>{
        const fo=(d&&d.followers)||[]; document.getElementById('counts').textContent=fo.length+' followers';
        if(!fo.length){ content.innerHTML='<div class="empty">No followers yet.</div>'; return; }
        content.innerHTML='<div class="slist">'+fo.map(f=>{
          const btn=f.youFollow?'<button class="followbtn out" data-unf="'+esc(f.name)+'">FOLLOWING</button>':'<button class="followbtn" data-fol="'+esc(f.name)+'">FOLLOW BACK</button>';
          return srow(f, btn);
        }).join('')+'</div>';
        content.querySelectorAll('[data-fol]').forEach(b=>b.onclick=()=>{ api('POST','/api/friends/add',{handle:b.getAttribute('data-fol')}).then(()=>render()); });
        content.querySelectorAll('[data-unf]').forEach(b=>b.onclick=()=>{ api('POST','/api/friends/remove',{handle:b.getAttribute('data-unf')}).then(()=>render()); });
        wireRows();
      });
    } else if(tab==='duels'){
      renderDuels();
    } else if(tab==='find'){
      content.innerHTML='<div class="findbar"><input id="q" placeholder="search players by name…" autocomplete="off"></div><div id="results"></div>';
      const inp=document.getElementById('q'), res=document.getElementById('results'); let t;
      inp.focus();
      inp.oninput=function(){ const q=this.value.trim(); clearTimeout(t); if(!q){ res.innerHTML=''; return; }
        t=setTimeout(()=>api('GET','/api/players/search?q='+encodeURIComponent(q)).then(d=>{
          const ps=(d&&d.players)||[];
          res.innerHTML=ps.length?('<div class="slist">'+ps.map(p=>srow(p, tok()?'<button class="followbtn" data-fol="'+esc(p.name)+'">FOLLOW</button>':'')).join('')+'</div>'):'<div class="empty">No players match.</div>';
          res.querySelectorAll('[data-fol]').forEach(b=>b.onclick=()=>{ const h=b.getAttribute('data-fol'); api('POST','/api/friends/add',{handle:h}).then(()=>{ b.textContent='✓ FOLLOWING'; b.classList.add('out'); b.disabled=true; }); });
          res.querySelectorAll('.srow[data-prof]').forEach(r=>r.onclick=e=>{ if(e.target.closest('button'))return; location.href=prof(r.getAttribute('data-prof')); });
        }), 250);
      };
    }
  }
  document.querySelectorAll('#subtabs button').forEach(b=>b.onclick=()=>{ tab=b.getAttribute('data-t'); document.getElementById('counts').textContent=''; render(); });

  // ---- duels (head-to-head, same seed) ----
  const DGAMES=['CINDER','SHIFT','CONDUIT','HOMEOSTAT','NOVA','SURGE','CLEAVE','FLUX','WEAVE','PULSE','INTERCEPT'];
  function entry(g){ g=(g||'').toLowerCase(); if(g==='motherload'||g==='motherload_cash')return 'motherload/index.html'; if(g==='ecotone')return 'ecotone/index.html'; return g+'.html'; }
  function fmtSc(v){ return v==null?'—':Number(v).toLocaleString(); }
  function renderDuels(){
    if(!tok()){ needSignIn(); return; }
    content.innerHTML='<div class="empty">Loading…</div>';
    api('GET','/api/duels').then(d=>{
      const list=(d&&d.duels)||[];
      let html='<button class="followbtn" id="newduel" style="margin:2px 0 14px">+ CHALLENGE A FRIEND</button>';
      if(!list.length){ html+='<div class="empty">No duels yet. Challenge a friend to beat your score on the same seed.</div>'; }
      else html+='<div class="slist">'+list.map(du=>{
        const other=du.youAreChallenger?du.opponent:du.challenger;
        const mine=du.youAreChallenger?du.challengerScore:du.opponentScore;
        const theirs=du.youAreChallenger?du.opponentScore:du.challengerScore;
        let st='', act='';
        if(du.status==='complete'){ const iWon=(du.youAreChallenger&&du.winner==='challenger')||(du.youAreOpponent&&du.winner==='opponent'); st=du.winner==='tie'?'TIED':(iWon?'YOU WON 🏆':'YOU LOST'); }
        else if(du.status==='declined'){ st='DECLINED'; }
        else if(mine==null){ st='Your move'; act='<a class="followbtn" href="'+entry(du.game)+'?seed='+encodeURIComponent(du.seed)+'">PLAY</a>'; }
        else { st='Waiting for '+esc(other); }
        return '<div class="srow"><span class="av">⚔</span><span class="mid"><div class="nm">'+esc(du.game)+' · vs '+esc(other)+'</div>'+
          '<div class="meta">you '+fmtSc(mine)+' · them '+fmtSc(theirs)+' — '+st+'</div></span>'+act+'</div>';
      }).join('')+'</div>';
      content.innerHTML=html;
      document.getElementById('newduel').onclick=newDuel;
    });
  }
  function newDuel(){
    content.innerHTML='<button class="followbtn out" id="back" style="margin:2px 0 14px">← back</button>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
      '<input class="findbar" id="dopp" placeholder="friend’s name" autocomplete="off" style="padding:11px 14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px">'+
      '<select id="dgame" style="padding:11px 14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-family:inherit">'+DGAMES.map(g=>'<option value="'+g+'">'+g+'</option>').join('')+'</select>'+
      '<button class="followbtn" id="dcreate">CREATE DUEL</button><div class="empty" id="dmsg" style="padding:6px 2px"></div></div>';
    document.getElementById('back').onclick=()=>{ tab='duels'; render(); };
    document.getElementById('dcreate').onclick=()=>{
      const opp=document.getElementById('dopp').value.trim(), game=document.getElementById('dgame').value;
      if(!opp){ document.getElementById('dmsg').textContent='Enter a name.'; return; }
      api('POST','/api/duel',{game,opponent:opp}).then(r=>{
        if(!r||r.error){ document.getElementById('dmsg').textContent=(r&&r.error)||'Couldn’t create duel.'; return; }
        content.innerHTML='<div class="empty" style="padding:24px 10px">Duel sent to <b style="color:var(--ink)">'+esc(opp)+'</b> in <b style="color:var(--ink)">'+esc(game)+'</b>.<br>Play your run on the same seed:</div>'+
          '<a class="followbtn" href="'+entry(game)+'?seed='+encodeURIComponent(r.seed)+'">▶ PLAY YOUR RUN</a>';
      });
    };
  }

  // ---- notifications (bell + tray + filters) ----
  const NLABEL={follow:'New followers',beaten:'Score beaten',dethroned:'Knocked out of top 10',fav_record:'Record on a favourite',new_game:'New games',challenge:'Challenges',challenge_result:'Challenge results'};
  function ago(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60)return 'just now'; const m=Math.floor(s/60); if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }
  function notifText(n){
    let pay={}; try{pay=JSON.parse(n.payload||'{}');}catch(x){}
    const a=esc(n.actor_name||'Someone'), g=esc(n.game||''), sc=pay.score?Number(pay.score).toLocaleString():'', gp='game.html?id='+encodeURIComponent(n.game||'');
    switch(n.kind){
      case 'follow': return {ic:'👤',tx:'<b>'+a+'</b> started following you',go:prof(n.actor_name)};
      case 'beaten': return {ic:'⚔',tx:'<b>'+a+'</b> beat your <b>'+g+'</b> score'+(sc?' · '+sc:''),go:gp};
      case 'dethroned': return {ic:'📉',tx:'You dropped out of the <b>'+g+'</b> top 10',go:gp};
      case 'fav_record': return {ic:'👑',tx:'<b>'+a+'</b> took <b>#1</b> in <b>'+g+'</b>',go:gp};
      case 'new_game': return {ic:'🎮',tx:'New game: <b>'+g+'</b>',go:gp};
      case 'challenge': return {ic:'🎯',tx:'<b>'+a+'</b> challenged you in <b>'+g+'</b>',go:'social.html'};
      case 'challenge_result': return {ic:'🏁',tx:esc(pay.text||('Challenge result · '+g)),go:'social.html'};
      default: return {ic:'•',tx:esc(n.kind),go:''};
    }
  }
  let _notifs=[];
  function loadUnread(){ if(!tok())return; api('GET','/api/notifications').then(d=>{ if(!d)return; _notifs=d.notifications||[]; const u=d.unread||0, bd=document.getElementById('nbadge'); bd.textContent=u>9?'9+':String(u); bd.classList.toggle('show',u>0); }); }
  function openTray(){
    const tray=document.getElementById('ntray'), body=document.getElementById('nbody');
    tray.classList.add('open');
    body.innerHTML=_notifs.length?_notifs.map(n=>{ const t=notifText(n); return '<div class="nitem'+(n.read_at?'':' unread')+'"'+(t.go?' data-go="'+t.go+'"':'')+'><span class="ic">'+t.ic+'</span><span class="tx">'+t.tx+'<div class="ago">'+ago(n.created_at)+'</div></span></div>'; }).join(''):'<div class="empty">No notifications yet.</div>';
    body.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{ location.href=el.getAttribute('data-go'); });
    api('POST','/api/notifications/read'); document.getElementById('nbadge').classList.remove('show');
  }
  function showFilters(){
    const body=document.getElementById('nbody'); body.innerHTML='<div class="empty">Loading…</div>';
    api('GET','/api/notifications/prefs').then(d=>{ const p=(d&&d.prefs)||{};
      body.innerHTML='<div class="prefs">'+Object.keys(NLABEL).filter(k=>k!=='challenge'&&k!=='challenge_result').map(k=>'<div class="prefrow"><span class="lbl">'+NLABEL[k]+'</span><button class="toggle'+(p[k]!==false?' on':'')+'" data-k="'+k+'"></button></div>').join('')+'</div>';
      body.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>{ t.classList.toggle('on'); const cur={}; body.querySelectorAll('.toggle').forEach(x=>cur[x.getAttribute('data-k')]=x.classList.contains('on')); api('POST','/api/notifications/prefs',cur); });
    });
  }
  if(tok()){ const bell=document.getElementById('bell'); bell.style.display=''; bell.onclick=openTray; loadUnread(); }
  document.getElementById('filt').onclick=showFilters;
  document.getElementById('ntray').onclick=e=>{ if(e.target.id==='ntray') document.getElementById('ntray').classList.remove('open'); };

  render();
})();
</script>
</body>
</html>
